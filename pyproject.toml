[project]
name = "ml-runner"
version = "0.1.0"
description = "Run any ML training repo on a disposable Google Cloud GPU VM and bring the results back."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "naresh", email = "reshs92.09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "platformdirs",
    "tomli-w",
    "typer",
]

[project.urls]
Repository = "https://github.com/recursive-reshy/ml-runner"

[project.scripts]
ml-runner = "ml_runner.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]
docs = [
    "diagrams>=0.25.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
