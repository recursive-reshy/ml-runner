[project]
name = "ml-runner"
version = "0.1.0"
description = "Run any ML training repo on a disposable Google Cloud GPU VM and bring the results back."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "naresh", email = "reshs92.09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "platformdirs",
    "tomli-w",
    "typer",
]

[project.urls]
Repository = "https://github.com/recursive-reshy/ml-runner"

[project.scripts]
ml-runner = "ml_runner.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]
docs = [
    "diagrams>=0.25.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

# the VM agent runs on the image's Python 3.10
per-file-target-version = { "src/ml_runner/vm/**" = "py310", "tests/vm/**" = "py310" }

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "B", "UP", "N", "SIM" ]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
